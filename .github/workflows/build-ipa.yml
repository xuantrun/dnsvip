name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install provisioning profile generator (if needed)
        run: echo "Environment ready."

      - name: Build NextDNSCustom App and DNSProxyExtension
        run: |
          xcodebuild build \
            -project NextDNSCustom.xcodeproj \
            -scheme NextDNSCustom \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/derivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/derivedData/Build/Products/Release-iphoneos/DNS VIP.app" build/Payload/
          cd build
          zip -qry DNS-VIP-v2.3.6.ipa Payload
          cp DNS-VIP-v2.3.6.ipa NextDNS-Custom-Blocked.ipa
          ls -la *.ipa
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNS-VIP-v2.3.6-IPA
          path: build/DNS-VIP-v2.3.6.ipa
          retention-days: 30
