name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Xcode Version
        run: |
          xcodebuild -version

      - name: Build Xcode Archive
        run: |
          xcodebuild clean archive \
            -project NextDNSCustom.xcodeproj \
            -scheme NextDNSCustom \
            -configuration Release \
            -archivePath build/NextDNSCustom.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/NextDNSCustom.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qry DNS-VIP-v2.3.0.ipa Payload
          cp DNS-VIP-v2.3.0.ipa NextDNS-Custom-Blocked.ipa
          ls -la *.ipa
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNS-VIP-v2.3.0-IPA
          path: build/DNS-VIP-v2.3.0.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: "DNS VIP iOS v2.3.0 (App Độc Lập • Tự Động Cấp Quyền VPN & DNS)"
          body: |
            ## 🚀 DNS VIP iOS App v2.3.0 (Bản Chính Thức)
            
            App lọc DNS và chặn game/quảng cáo độc lập 100% dành cho iOS.
            
            ### ✨ Tính Năng Nổi Bật:
            - 🛡️ **Ứng Dụng Độc Lập Hoàn Toàn**: Không cần tài khoản, không cần nhập mã NextDNS (Zero Configuration).
            - ⚡ **Tự Động Cấp Quyền VPN & DNS**: Vừa vào app hoặc bấm nút BẬT là hệ thống iOS hiện ngay hộp thoại xin quyền.
            - 📱 **Tích Hợp Vào Cài Đặt iOS**: Xuất hiện trực tiếp trong mục **Cài đặt -> Cài đặt chung -> VPN & Quản lý thiết bị -> DNS** với tên **DNS VIP**.
            - 🎯 **Tùy Chọn Kèm Theo**: Hỗ trợ cài trực tiếp Profile `.mobileconfig` (có biểu tượng bánh răng trong Cài đặt).
            - 🚫 **Bộ Lọc Cực Mạnh**: Tích hợp sẵn 28 domain exact và 17 wildcard (FreeFire CDN, AppsFlyer, Garena, Akamai, Facebook Ads,...).
            - 📊 **Kiểm Tra Nhật Ký Trực Tiếp (Live Log)**: Tab Nhật ký theo dõi thời gian thực, gắn nhãn đỏ `BLOCKED` (NXDOMAIN/0.0.0.0) ngay lập tức.
            - 📱 **Giao Diện Full Màn Hình**: Tối ưu hiển thị tràn viền trên mọi dòng iPhone (không viền đen).
          files: |
            build/DNS-VIP-v2.3.0.ipa
            build/NextDNS-Custom-Blocked.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
