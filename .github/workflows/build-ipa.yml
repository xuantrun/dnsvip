name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Xcode Version
        run: |
          xcodebuild -version

      - name: Build Xcode Archive
        run: |
          xcodebuild clean archive \
            -project NextDNSCustom.xcodeproj \
            -scheme NextDNSCustom \
            -configuration Release \
            -archivePath build/NextDNSCustom.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/NextDNSCustom.xcarchive/Products/Applications/NextDNS.app build/Payload/
          cd build
          zip -qry NextDNS-Custom-Blocked.ipa Payload
          ls -la NextDNS-Custom-Blocked.ipa
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextDNS-Custom-Blocked-IPA
          path: build/NextDNS-Custom-Blocked.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: "DNS VIP iOS v2.3.0 (Tự động xin quyền VPN & DNS • Full Screen)"
          body: |
            ## 🚀 DNS VIP iOS App v2.3.0
            - 🛡️ **App Độc Lập**: Hoạt động riêng biệt không phụ thuộc bất kỳ tài khoản hay mã NextDNS nào.
            - ⚡ **Tự động xin quyền**: Mở app bấm 'BẬT BẢO VỆ' sẽ hiện ngay popup cấp quyền hệ thống.
            - 📱 **Hiện trong Cài đặt iOS**: Xuất hiện trực tiếp tên 'DNS VIP' trong Cài đặt Proxy DNS và DNS.
            - 🚫 **Chặn triệt để**: Tích hợp sẵn toàn bộ 28 domain exact & 17 wildcard FreeFire & Tracking.
            - 📋 **Nhật ký thời gian thực**: Xem các truy vấn mạng đang bị chặn với nhãn đỏ BLOCKED.
          files: build/NextDNS-Custom-Blocked.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
