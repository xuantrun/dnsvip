name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Xcode Version
        run: |
          xcodebuild -version

      - name: Build Xcode Archive
        run: |
          xcodebuild clean archive \
            -project NextDNSCustom.xcodeproj \
            -scheme NextDNSCustom \
            -configuration Release \
            -archivePath build/NextDNSCustom.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/NextDNSCustom.xcarchive/Products/Applications/NextDNS.app build/Payload/
          cd build
          zip -qry NextDNS-Custom-Blocked.ipa Payload
          ls -la NextDNS-Custom-Blocked.ipa
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextDNS-Custom-Blocked-IPA
          path: build/NextDNS-Custom-Blocked.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: "NextDNS Custom Blocked v2.1.0 (Full Screen + Live Logs)"
          body: |
            ## 🚀 NextDNS Custom iOS App v2.1.0
            - ✅ Giao diện Full Màn Hình (Native Edge-to-Edge) không còn viền đen.
            - ✅ Quản lý VPN & DNS hệ thống giống app NextDNS chính thức (test.nextdns.io + liên kết Cài đặt iOS).
            - ✅ Màn hình Kiểm tra Nhật ký DNS (Logs) xem thời gian thực đang chặn những domain nào (FreeFire, Tracking,...).
            - ✅ Đầy đủ 28 domain exact & 17 wildcard.
          files: build/NextDNS-Custom-Blocked.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
