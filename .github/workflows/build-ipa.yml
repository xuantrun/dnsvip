name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Xcode Version
        run: |
          xcodebuild -version

      - name: Build Xcode Archive
        run: |
          xcodebuild clean archive \
            -project NextDNSCustom.xcodeproj \
            -scheme NextDNSCustom \
            -configuration Release \
            -archivePath build/NextDNSCustom.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/NextDNSCustom.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qry DNS-VIP-v2.3.3.ipa Payload
          cp DNS-VIP-v2.3.3.ipa NextDNS-Custom-Blocked.ipa
          ls -la *.ipa
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNS-VIP-v2.3.3-IPA
          path: build/DNS-VIP-v2.3.3.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.3
          name: "DNS VIP iOS v2.3.3 (Giao Diện Chuẩn NextDNS • Fix Nhật Ký Thật • Bật [VPN])"
          body: |
            ## 🚀 DNS VIP iOS App v2.3.3 (NextDNS Pure Edition)
            
            - 🎨 **Giao Diện Chuẩn NextDNS**: Thiết kế Inset Grouped tối giản, công tắc gạt toggle iOS nguyên bản, thanh trạng thái kết nối chuyên nghiệp.
            - 📊 **Fix Triệt Để Nhật Ký Truy Vấn**:
              * Xóa bỏ hoàn toàn dữ liệu mẫu tự tải (không còn tình trạng out ra vào lại tự load data giả).
              * Hỗ trợ lưu trữ chia sẻ thời gian thực giữa App & Extension.
              * Tự động làm mới (Live Auto-refresh 1.5s) khi mở tab Nhật ký.
            - ⚡ **Kích Hoạt Icon [VPN] Trên iPhone**: Hoàn thiện `NEPacketTunnelProvider`, hiển thị biểu tượng [VPN] góc trên màn hình khi bật bảo vệ.
            - 🚫 **Bộ Lọc Game & Tracker**: 28 domain exact & 17 wildcard tích hợp sẵn.
          files: |
            build/DNS-VIP-v2.3.3.ipa
            build/NextDNS-Custom-Blocked.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
