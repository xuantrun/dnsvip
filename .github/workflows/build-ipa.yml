name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Xcode Version
        run: |
          xcodebuild -version

      - name: Build Xcode Archive
        run: |
          xcodebuild clean archive \
            -project NextDNSCustom.xcodeproj \
            -scheme NextDNSCustom \
            -configuration Release \
            -archivePath build/NextDNSCustom.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/NextDNSCustom.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qry DNS-VIP-v2.3.2.ipa Payload
          cp DNS-VIP-v2.3.2.ipa NextDNS-Custom-Blocked.ipa
          ls -la *.ipa
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNS-VIP-v2.3.2-IPA
          path: build/DNS-VIP-v2.3.2.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.2
          name: "DNS VIP iOS v2.3.2 (Fix VPN Yêu Cầu Cập Nhật • Bật Icon [VPN] iPhone)"
          body: |
            ## 🚀 DNS VIP iOS App v2.3.2 (Bản Fix Hoàn Thiện VPN)
            
            - 🛡️ **Fix Lỗi 'Yêu cầu cập nhật' trong Cài đặt**: Cập nhật extension sang chuẩn `NEPacketTunnelProvider` tương thích 100% với iOS.
            - ⚡ **Hiện Biểu Tượng [VPN] Trên iPhone**: Khi bật bảo vệ, app tự động kích hoạt tunnel và hiển thị icon [VPN] trực tiếp trên thanh trạng thái.
            - 📱 **Hiện Trong Cài Đặt DNS & VPN**: Xuất hiện đồng thời cả trong mục **Cài đặt -> VPN** và **Cài đặt -> DNS** với tên **DNS VIP**.
            - 🚫 **Chặn Triệt Để 45 Quy Tắc**: 28 domain exact & 17 wildcard lọc sạch game & tracker.
          files: |
            build/DNS-VIP-v2.3.2.ipa
            build/NextDNS-Custom-Blocked.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
